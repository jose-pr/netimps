# The configuration a CONSUMER of netimps actually runs.
#
# `tests/typing/api.py` exists to prove the promises in the shipped API header
# hold for somebody importing this package -- so it has to be checked the way
# that person checks it, not the way the package checks itself.
#
# The difference is one flag. The package's own `[tool.mypy]` sets
# `enable_incomplete_feature = ["TypeForm"]`, because `__init__.py`'s overloads
# are written in terms of `TypeForm[_T]` and mypy refuses to type-check that
# definition without the flag. Nobody downstream sets it: TypeForm is
# experimental, and a consumer has no reason to opt into it.
#
# Measured, with mypy 1.20.2:
#   with    TypeForm enabled -> api.py reports 25 errors, all of the shape
#                               'No overload variant of "parse" matches
#                               argument types "str", "<typing special form>"'
#   without TypeForm enabled -> api.py is clean, and the revealed types are
#                               exactly what the header promises:
#                                 parse(v, IPNetwork) -> IPv4Network | IPv6Network
#                                 parse(v, IPAddress) -> IPv4Address | IPv6Address
#                                 parse(v, IPv4Address) -> IPv4Address
#
# The errors are therefore an artefact of the experimental flag, not a defect in
# the contract -- and mypy never reports a library's internal errors to the
# people importing it, so this config is the honest test of what they get.
#
# python_version pins the floor for the same reason the package config does: an
# error that only appears on the oldest supported interpreter is the one worth
# catching.
[mypy]
python_version = 3.9
mypy_path = src
