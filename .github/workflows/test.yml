name: Test

# Three ways to trigger:
#   - push to main, so the README's CI badge reflects the state of main rather
#     than whichever manual run happened last.
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
on:
  push:
    branches:
      - main
    tags:
      - "ci-*"
  # Gate pull requests too. Without this a PR is unchecked until it merges,
  # which is the one moment the check is worth having.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The gate behind the shipped type promise: formatting, the package's own
    # type contract, and the typing-conformance file. Each is opt-in config
    # that drifts silently without a job behind it, while `py.typed` promises
    # callers a checked surface.
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          # The floor, deliberately: `[tool.mypy] python_version = "3.9"` means the
          # errors that only appear on the oldest supported version are the ones
          # worth catching.
          python-version: "3.9"
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check src/ tests/
      - name: Type-check the package for every target platform
        # `mypy --platform` matters here as much as the Python version does.
        # This package is full of per-platform branches, and mypy checks ALL of
        # them whatever host it runs on -- but it resolves names like
        # `ctypes.WinDLL`, `socket.SIO_RCVALL` and `socket.ioctl` against the
        # platform it thinks it is targeting. So a clean run on a Windows laptop
        # says nothing about the Linux runner: `attr-defined` errors reach CI
        # past a green local check.
        #
        # Three runs, one per platform the matrix below tests.
        run: |
          python -m mypy --platform linux src/netimps
          python -m mypy --platform darwin src/netimps
          python -m mypy --platform win32 src/netimps
      - name: Type-check the public typing contract
        # tests/typing/api.py exists to prove the shipped header's static-typing
        # promises. It is not a pytest module, so pytest never collects it and
        # this step is the only thing that runs it.
        #
        # Deliberately checked with a CONSUMER's config, not the package's own:
        # the package enables the experimental TypeForm feature so mypy will
        # type-check its own overload definitions, and nobody downstream does.
        # tests/typing/consumer.ini explains the difference and the measurement.
        run: python -m mypy --config-file tests/typing/consumer.ini tests/typing/api.py

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        # Install every extra that has tests depending on it, or those tests
        # silently skip (pytest.importorskip) instead of actually running.
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        # tests/integration/test_platform_smoke.py is collected here on purpose. The rest of
        # the suite fakes subprocess.run throughout, so it asserts the argv the
        # library BUILDS and never that the platform's binary accepts it -- which
        # is how every IPv6 ping on macOS can break while CI stays green
        # (`ping -6` is not a flag there). The smoke file is the one place
        # that runs the real binary, loopback only, and it must gate the matrix.
        # -rs prints the reason for every skip. A skip is not a pass, and this
        # suite has guards that step aside on a host without IPv6 or without
        # recvmsg -- so a silent skip count is indistinguishable from the
        # platform tests never running at all, which is the failure this whole
        # file exists to make impossible.
        run: python -m pytest -q -rs

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only ever gets the newest
  # releases, so a floor that no longer works would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # What a user gets from `pip install netimps` with no extra: the library
  # imports, and the console script says which extra it needs instead of
  # raising an ImportError. The test jobs above always have every extra.
  bare:
    name: Bare install (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with no extra
        run: python -m pip install .
      - name: The library imports and the console script names the extra
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import netimps; print('imported', netimps.__version__)"
          if netimps interfaces > out.txt 2> err.txt; then
            echo "the console script ran without the cli extra"; exit 1
          fi
          cat err.txt
          grep -q "'cli' extra" err.txt

  # What a user installs is the built wheel, not the checkout: build it, install
  # it with the cli extra into a clean environment away from the source tree,
  # and run the console script, on each OS.
  wheel:
    name: Built wheel and console script (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "${{ runner.temp }}/dist"
      - name: Install it into a fresh environment, away from the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          if [ -d wheel-env/Scripts ]; then BIN=wheel-env/Scripts; else BIN=wheel-env/bin; fi
          "$BIN/python" -m pip install "$(ls dist/*.whl)[cli]"
          "$BIN/netimps" addr 00:00:5e:00:53:01
          "$BIN/netimps" split "[::1]:8080"
          "$BIN/netimps" interfaces > /dev/null
          "$BIN/python" - <<'PY'
          from importlib.resources import files

          import netimps

          root = files("netimps")
          for name in ("py.typed", "AGENTS.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          assert "site-packages" in netimps.__file__, netimps.__file__
          print("ok:", netimps.__file__)
          PY
