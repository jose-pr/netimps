[build-system]
# 1.27 is the first hatchling that reads the PEP 639 license fields below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netimps"
version = "0.4.1"
authors = [{ name = "jose-pr", email = "jose-pr@coqui.dev" }]
description = "Small, self-contained network utilities: IP/MAC types, DNS lookup, ping, NIC discovery"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# dnspython backs resolve_dnspython() only -- resolve_system()/resolve_nslookup()
# (and resolve()'s fallback chain through them) work without it, so it is not a
# hard dependency. Importing netimps must never require it. Major-scoped; 2.7 is
# the newest series that installs on Python 3.9 (2.8 needs 3.10).
dns = ['dnspython>=2.7,<3']
# The CLI is optional: importing netimps must never require duho.
cli = ['duho>=0.7.0,<0.8']
# The tests exercise every extra, so dev refers to them rather than repeating
# their ranges.
dev = ['netimps[cli,dns]', 'build', 'twine', 'hatchling', 'pytest', 'black', 'mypy<2', 'distlib>=0.4.0,<0.5']
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

[project.scripts]
netimps = "netimps.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/netimps"
Documentation = "https://jose-pr.github.io/netimps/"
Issues = "https://github.com/jose-pr/netimps/issues"

[tool.hatch.build.targets.sdist]
# Two separate guards. "/.*" is dotfiles only -- it provably does not cover
# `*.local.*` (fnmatch('AGENTS.local.md', '.*') is False), and a `*.local.*`
# file must never be packaged, so it needs a pattern of its own.
# The root AGENTS.md (contributor orientation) and the benchmarks are for a
# checkout, not for someone who installed the library.
exclude = ["/.*", "*.local.*", "/AGENTS.md", "/benchmarks"]

[tool.hatch.build.targets.wheel]
# The package directory ships wholesale, so the `*.local.*` guard has to be
# repeated here: the sdist exclude above does not apply to the wheel.
exclude = ["*.local.*"]

# Ship the *consumer-facing* docs inside the installed package, so a consuming
# agent can read them from site-packages via importlib.resources rather than
# needing the repo.
#
# src/netimps/AGENTS.md is included automatically by living in the package dir.
# The repo-root AGENTS.md is deliberately NOT shipped: it is development
# documentation (venvs, CI, release process) and is useless to someone who has
# only installed the library.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "netimps/README.md"

[tool.black]
# 3.9 is the floor, so don't let black emit syntax newer than that.
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
enable_incomplete_feature = ["TypeForm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Warnings are errors. An exception would be listed here as narrowly as the
# warning's own text, with the reason it is tolerated; there are none.
filterwarnings = ["error"]
